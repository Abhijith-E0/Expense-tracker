<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Expense Tracker</h1>

    <div class="balance-box">
        <h3>Balance</h3>
        <h2 id="balance">₹0</h2>
    </div>


    <div class="summary">

        <div class="income">
            <h4>Income</h4>
            <p id="income">₹0</p>
        </div>

        <div class="expense">
            <h4>Expense</h4>
            <p id="expense">₹0</p>
        </div>

    </div>


    <form id="expenseForm">

        <input 
        type="text" 
        id="title"
        placeholder="Enter description"
        required>


        <input 
        type="number"
        id="amount"
        placeholder="Enter amount"
        required>


        <select id="type">

            <option value="income">
                Income
            </option>

            <option value="expense">
                Expense
            </option>

        </select>


        <button>
            Add Transaction
        </button>

    </form>


    <div class="filter">

        <button onclick="filterData('all')">
            All
        </button>

        <button onclick="filterData('income')">
            Income
        </button>

        <button onclick="filterData('expense')">
            Expense
        </button>

    </div>


    <ul id="transactionList"></ul>


</div>


<script src="script.js"></script>

</body>
</html>
